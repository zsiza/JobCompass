<app-bealert></app-bealert>
<div class="login-container">
    <h2>Bejelentkezés</h2>

    <form #addForm="ngForm" (ngSubmit)="onLogin(addForm)" method="POST">
    <label for="username">Felhasználó név</label>
    <input type="text" id="username" placeholder="Felhasználó név" name="username" ngModel required>

    <label for="password">Jelszó</label>
    <input type="password" id="password" placeholder="Jelszó" name="password" ngModel required>

   <button [disabled]="addForm.invalid" type="submit">BEJELENTKEZÉS</button>

   <p>Nincs még fiókod? <a href="register">Regisztrálj most!</a></p>


    </form>
    
    </div>
