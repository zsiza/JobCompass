<!-- changeprofile.component.html -->
<div class="main">
    <h2>PROFIL</h2>
    <div class="card">
        <div class="image-container" id="profile-image-container">
            <img [src]="selectedImage" alt="..." id="profile-image">
            <p>Profilkép megváltozatása</p>
            <input type="radio" id="male" name="gender" value="male" (change)="updateImage('male')">
            <label for="male">Férfi</label><br>
            <input type="radio" id="female" name="gender" value="female" (change)="updateImage('female')">
            <label for="female">Női</label><br>
            <input type="radio" id="default" name="gender" value="default" (change)="updateImage('default')">
            <label for="default">Általános</label><br>
        </div>        
        <div class="card-body">
            <form action="#" method="post">
                <table>
                    <tbody>
                        <tr>
                            <td>Név</td>
                            <td><input type="text" name="nev" id="nev" value="név" required></td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td><input type="email" name="email" id="email" value="email@email.com" required></td>
                        </tr>
                        <tr>
                            <td>Lakcím</td>
                            <td><input type="text" name="lakcim" id="lakcim"  value="Szeged" required></td>
                        </tr>
                        <tr>
                            <td>Hobbik</td>
                            <td><input type="text" name="hobbik" id="hobbik" value="Diving, Reading Book" required></td>
                        </tr>
                        <tr>
                            <td>Munka</td>
                            <td><input type="text" name="munka" id="munka" value="Web Developer" required></td>
                        </tr>
                        <tr>
                            <td>Képzettségek</td>
                            <td><input type="text" name="kepzettsegek" id="kepzettsegek" value="PHP, HTML, CSS, Java" required></td>
                        </tr>
                    </tbody>
                </table>
                <a routerLink="/profile"><button type="submit"><strong>Mentés</strong></button></a>
            </form>
        </div>
    </div>
</div>
