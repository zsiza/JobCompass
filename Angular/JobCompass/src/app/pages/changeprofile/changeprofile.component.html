<!-- changeprofile.component.html -->
<div class="main">
    <h2>PROFIL</h2>
    <div class="card">
        <div class="image-container" id="profile-image-container">
            <img [src]="selectedImage" alt="..." id="profile-image">
            <p>Profilkép megváltozatása</p>
            <input type="radio" id="1" name="gender" value="1" (change)="updateImage('1')">
            <label for="male">Férfi</label><br>
            <input type="radio" id="2" name="gender" value="2" (change)="updateImage('2')">
            <label for="female">Női</label><br>
            <input type="radio" id="3" name="gender" value="3" (change)="updateImage('3')">
            <label for="default">Általános</label><br>
        </div>        
        <div class="card-body">
            <form action="#" method="post">
                <table>
                    <tbody>
                        <tr>
                            <td>Név</td>
                            <td><input type="text" name="nev" id="nev" placeholder="Név" required></td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td><input type="email" name="email" id="email" placeholder="Email" required></td>
                        </tr>
                        <tr>
                            <td>Lakcím</td>
                            <td><input type="text" name="lakcim" id="lakcim" placeholder="Lakcím" required></td>
                        </tr>
                        <tr>
                            <td>Készségek</td>
                            <td><input type="text" name="hobbik" id="hobbik" placeholder="Készségek" required></td>
                        </tr>
                        <tr>
                            <td>Tapasztalat</td>
                            <td><input type="text" name="tapasztalat" id="tapasztalat" placeholder="Tapasztalat" required></td>
                        </tr>
                        <tr>
                            <td>Végzettség</td>
                            <td><input type="text" name="vegzettseg" id="vegzettseg" placeholder="Végzettség" required></td>
                        </tr>
                        <tr>
                            <td>Elérhetőségek</td>
                            <td><input type="text" name="elerhetosegek" id="elerhetosegek" placeholder="Elérhetőségek" required></td>
                        </tr>
                    </tbody>
                </table>
                <a routerLink="/profile"><button type="submit"><strong>Mentés</strong></button></a>
            </form>
        </div>
    </div>
</div>
