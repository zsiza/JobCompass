<div class="register-container">
  <h2>Regisztráció</h2>

  <form #addForm="ngForm" (ngSubmit)="onAddUser(addForm)" method="POST">
  <label for="email">Email cím</label>
  <input type="email" ngModel id="email" placeholder="Email cím" name="email" required>

  <label for="firstname">Kereszt név</label>
  <input type="text" ngModel id="firstname" placeholder="Kereszt név" name="firstname" required>

  <label for="lastname">Vezeték név</label>
  <input type="text" ngModel id="lastname" placeholder="Vezeték név" name="lastname" required>

  <label for="username">Felhasználó név</label>
  <input type="text" ngModel id="username" placeholder="Felhasználó név" name="username" required>

  <label for="password">Jelszó</label>
  <input type="password" ngModel id="password" placeholder="Jelszó" name="password" required>

<!--  <input type="reset" name="reset-btn" value="Reset"/>-->
  <button [disabled]="addForm.invalid" type="submit">REGISZTRÁLJ</button>

  </form>
  
  </div>
