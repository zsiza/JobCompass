<div class="register-container">
    <h2>Regisztráció</h2>

    <form method="POST">
    <label for="email">Email cím</label>
    <input type="email" id="email" placeholder="Email cím" name="email" required>

    <label for="firstname">Kereszt név</label>
    <input type="text" id="firstname" placeholder="Kereszt név" name="firstname" required>

    <label for="lastname">Vezeték név</label>
    <input type="text" id="lastname" placeholder="Vezeték név" name="lastname" required>

    <label for="username">Felhasználó név</label>
    <input type="text" id="username" placeholder="Felhasználó név" name="username" required>

    <label for="password">Jelszó</label>
    <input type="password" id="password" placeholder="Jelszó" name="password" required>


    <label for="psw-confirm">Jelszó megerősítés</label>
    <input type="password" placeholder="Jelszó megerősítés" name="psw-confirm" required> 

  <!--  <input type="reset" name="reset-btn" value="Reset"/>-->
    <button type="submit">REGISZTRÁLJ</button>

    </form>
    
    </div>
