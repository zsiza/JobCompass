<div class="form">
    <h2>Hirdetés létrehozása</h2>
  
    <form #addForm="ngForm" (ngSubmit)="onAddService(addForm)" method="POST">
      <label for="category">Kategória:</label><br>
      <select id="category" name="selectedCategoryInt" [(ngModel)]="newService.categoryId" required>
        <option value="" disabled selected>--Válassz a listából--</option>
        <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
      </select><br><br>
  
      <label for="title">Cím:</label><br>
      <input type="text" id="title" name="title" [(ngModel)]="newService.title" required/> <br/><br/>
  
      <label for="description">Leírás:</label> <br/>
      <textarea id="description" name="description" [(ngModel)]="newService.description" maxlength="400" required></textarea> <br/><br>
  
      <div class="form-row">
        <label for="days">Munkavégzéshez szükséges napok száma:</label>
        <input type="number" id="days" name="days" [(ngModel)]="newService.deliveryTime" min="1" max="365" step="1" required><br><br>
      </div>
  
      <div class="form-row">
        <label for="price">Ár:</label>
        <input type="number" id="price" name="price" [(ngModel)]="newService.price" required> <br/><br/>
      </div>
  
      <input type="submit" name="submit-btn" value="Létrehoz" [disabled]="addForm.invalid"/>
    </form>
  </div>
